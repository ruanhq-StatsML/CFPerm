name: Python Package using Conda

on: [push]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 5
    defaults:
      run:
        shell: bash -l {0}

    steps:
    - uses: actions/checkout@v4
    - name: Set up Miniconda
      uses: conda-incubator/setup-miniconda@v3
      with:
        auto-update-conda: true
        python-version: "3.10"
        activate-environment: cfperm
        environment-file: environment.yml
        auto-activate-base: false
    - name: Verify toolchain
      run: |
        conda info
        conda list
        python -c "import flake8, pytest, numpy, sklearn; print('ok')"
    - name: Lint with flake8
      run: |
        # Syntax / undefined-name gate on tests + runners only.
        # Legacy Python/src ships pre-existing E999/F821 in older CFPerm scripts.
        python -m flake8 tests scripts --count --select=E9,F63,F7,F82 --show-source --statistics
        python -m flake8 tests scripts --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      run: |
        export PYTHONPATH="${PYTHONPATH:+$PYTHONPATH:}$GITHUB_WORKSPACE/Python/src"
        python -m pytest tests
